# Snakemake config
input:
output: 'tcga_cptac_taxonomic_profiler.out/'
log: 'tcga_cptac_taxonomic_profiler/tcga_cptac_taxonomic_profiler.log'
# TMPDIR
# define the paths here
tmpdir: '/hpcfs/users/a1667917/tmp'

resources:
    massive:
        mem: 1800000
        cpu: 72 
        time: 4000 
    big:
        mem: 150000      # Memory for big (mostly mmseqs) jobs in megabytes (e.g 64GB = 64000, recommend >= 64000)
        cpu: 32         # Threads (recommend >= 16)
        time: 2000      # Max runtime in minutes (allows to set max time for the scheduler via snakemake profiles)
    med:
        mem: 32000      # Memory for most jobs in megabytes (recommend >= 32000)
        cpu: 16         # CPUs for most jobs in megabytes (recommend >= 16)
        time: 500        # Max runtime in minutes for medium jobs (relevant for scheduler)
    sml:
        mem: 4000
        cpu: 1
        time: 5        # Max runtime in minutes for small jobs (used for grouped jobs; relevant for scheduler)
    gpu: # for semibin sned to gpu
        partition: 'a100'
        slurm: 'gres=gpu:1'
        mem: 32000
        cpu: 9
        time: 600


# DBs
# define the paths here
databases:
    host_db: '/hpcfs/users/a1667917/metagenomics_dbs/host_genome_db'
    kraken: '/hpcfs/users/a1667917/metagenomics_dbs/kraken2/k2_pluspf_20230605'
    mmseqs2:
        uniref50: '/hpcfs/users/a1667917/metagenomics_dbs/mmseqs2/UniRef50/UniRef50'
        uniref90: '/hpcfs/users/a1667917/metagenomics_dbs/mmseqs2/UniRef90/UniRef90'
    checkm2: '/hpcfs/users/a1667917/metagenomics_dbs/checkm2_db/CheckM2_database/uniref100.KO.1.dmnd'
    gtdb: '/hpcfs/users/a1667917/GTDB/release226/'
    bakta: '/hpcfs/users/a1667917/metagenomics_dbs/bakta/db'
    singlem: '/hpcfs/users/a1667917/metagenomics_dbs/singlem/S5.4.0.GTDB_r226.metapackage_20250331.smpkg.zb'
    metabuli: '/hpcfs/users/a1667917/metagenomics_dbs/metabuli/GTDB226'


# metabuli (joint amino acid + DNA classification)
# precise=1 selects the short-read preset; reads here are 51 or 101 bp.
# max_ram_gib must stay under resources.big.mem (150000 MB = ~146 GiB).
metabuli:
    max_ram_gib: 120
    precise: 1        # 1 = short-read preset
    min_score: 0
    seq_mode: 2       # 1 single-end, 2 paired-end, 3 long read


# host depletion (deacon)
# Deacon defaults are abs_threshold 2, rel_threshold 0.01.
# abs_threshold 1 is more aggressive: preferred for tumour WGS, where a
# retained human read costs more than a discarded microbial one.
deacon:
    abs_threshold: 1
    rel_threshold: 0.01


binning:
    min_contig_length: 1000
    separator: ":"
    minfasta: 200000 # the min bin size for VAMB

mge:
    genomad_db: '/hpcfs/users/a1667917/genomad/genomad_db'


