# Snakemake config
input:
output: 'tcga_cptac_taxonomic_profiler.out/'
log: 'tcga_cptac_taxonomic_profiler/tcga_cptac_taxonomic_profiler.log'
# TMPDIR
# define the paths here
tmpdir: '/hpcfs/users/a1667917/tmp'

resources:
    massive:
        mem: 1800000
        cpu: 72 
        time: 4000 
    big:
        mem: 150000      # Memory for big (mostly mmseqs) jobs in megabytes (e.g 64GB = 64000, recommend >= 64000)
        cpu: 32         # Threads (recommend >= 16)
        time: 2000      # Max runtime in minutes (allows to set max time for the scheduler via snakemake profiles)
    med:
        mem: 32000      # Memory for most jobs in megabytes (recommend >= 32000)
        cpu: 16         # CPUs for most jobs in megabytes (recommend >= 16)
        time: 500        # Max runtime in minutes for medium jobs (relevant for scheduler)
    sml:
        mem: 4000
        cpu: 1
        time: 5        # Max runtime in minutes for small jobs (used for grouped jobs; relevant for scheduler)
    gpu: # for semibin sned to gpu
        partition: 'a100'
        slurm: 'gres=gpu:1'
        mem: 32000
        cpu: 9
        time: 600


# DBs
# define the paths here
databases:
    host_db: '/hpcfs/users/a1667917/metagenomics_dbs/host_genome_db'
    kraken: '/hpcfs/users/a1667917/metagenomics_dbs/kraken2/k2_pluspf_20230605'
    mmseqs2:
        uniref50: '/hpcfs/users/a1667917/metagenomics_dbs/mmseqs2/UniRef50/UniRef50'
        uniref90: '/hpcfs/users/a1667917/metagenomics_dbs/mmseqs2/UniRef90/UniRef90'
    checkm2: '/hpcfs/users/a1667917/metagenomics_dbs/checkm2_db/CheckM2_database/uniref100.KO.1.dmnd'
    gtdb: '/hpcfs/users/a1667917/GTDB/release226/'
    # Existing 84 GB install, schema v6.0 (2025-02-24), requires bakta >=1.11
    bakta: '/home/a1667917/a1667917/bakta_db/db'
    # baktfold structural annotation database, 807 GB, already installed
    # (ProstT5 + foldseek indices for SwissProt/AFDB/PDB/CATH). Note the
    # *_gpu variants inside are symlinks to /scratchdata1; they are only used
    # if baktfold is given --foldseek-gpu, which run_baktfold does not.
    baktfold: '/home/a1667917/a1667917/baktfold_db'
    # SingleM is on GTDB R232, not R226 like Metabuli and GTDB-Tk. singlem
    # >=0.21.4 is required (earlier versions treat DIAMOND's stderr as fatal)
    # and hard-rejects the R226 metapackage. SingleM contributes a microbial
    # *fraction*, not taxonomy used for cross-tool comparison, so the release
    # mismatch does not affect the load comparison.
    singlem: '/hpcfs/users/a1667917/metagenomics_dbs/singlem/S6.5.0.GTDB_r232.metapackage_20260319.smpkg.zb'
    metabuli: '/hpcfs/users/a1667917/metagenomics_dbs/metabuli/GTDB226/gtdb+human+virus'
    # sylph GTDB r220, -c 200 "sensitive" build. No R226 build is published, so
    # sylph is a third GTDB release in the stack (Metabuli/GTDB-Tk R226, SingleM
    # R232, sylph R220). Acceptable on the same grounds as SingleM: sylph
    # contributes detection + containment ANI, not taxonomy compared taxon-by-taxon.
    sylph: '/hpcfs/users/a1667917/metagenomics_dbs/sylph/gtdb-r220-c200-dbv1.syldb'


# sylph (ANI-based containment profiling)
# min_ani is deliberately below sylph's own default of 95 for `profile`: the
# low-ANI tail is the contamination signal to observe and filter in R, not to
# discard at profiling time.
sylph:
    min_ani: 90
    min_kmers: 50            # sylph default
    estimate_read_counts: true   # gives counts, so ALDEx2-style decontamination stays possible
    # NOTE: sylph 0.9.0 force-enables -u whenever --estimate-read-counts is set
    # ("--estimate-read-counts detected, also enabling -u"). This flag is
    # therefore documentation of what happens, not a control. Sequence_abundance
    # is scaled by the estimated unknown fraction either way.
    estimate_unknown: false


# metabuli (joint amino acid + DNA classification)
# precise=1 selects the short-read preset; reads here are 51 or 101 bp.
# max_ram_gib must stay under resources.big.mem (150000 MB = ~146 GiB).
metabuli:
    max_ram_gib: 120
    precise: 1        # 1 = short-read preset
    min_score: 0
    seq_mode: 2       # 1 single-end, 2 paired-end, 3 long read


# host depletion (deacon)
# Deacon defaults are abs_threshold 2, rel_threshold 0.01.
# abs_threshold 1 is more aggressive: preferred for tumour WGS, where a
# retained human read costs more than a discarded microbial one.
deacon:
    abs_threshold: 1
    rel_threshold: 0.01


binning:
    # Which Binette consensus bins are carried into annotation (ALL_MAGS).
    # The usual convention, and MIMAG's quantitative half:
    #   high    completeness >  90, contamination <  5
    #   medium  completeness >= 50, contamination < 10
    # Only the quantitative criteria are applied at this point; the rRNA/tRNA
    # half of MIMAG needs bakta, which runs downstream, and mimag.py combines
    # them. On the 30-sample subset this selects 108 of 116 bins (77 high,
    # 31 medium).
    mag_min_completeness: 50
    mag_max_contamination: 10
    # 1500, not 1000. MetaBAT2 refuses outright below 1500
    #   "[Error!] Contig length < 1500 is not allowed to be used for binning."
    # and SemiBin2's internal default of 2500 left it with an empty matrix
    #   "ValueError: operands could not be broadcast together with shapes (0,30)"
    #
    # Catalogue length distribution (30-sample subset, 67,126 contigs, 318 Mb):
    #   >=1000 100.0% | >=1500 59.2% | >=2000 40.5% | >=2500 30.3%
    #
    # 1500 is MetaBAT2's floor and retains 59% of contigs (and the large majority
    # of assembled bases, since short contigs carry little sequence). It is passed
    # explicitly to every binner so they all bin the SAME contig set - otherwise
    # each tool applies its own default and the consensus compares tools that
    # were given different data.
    min_contig_length: 1500
    # run_comebin.sh defaults to -d cuda; compute nodes are CPU so this must be
    # set explicitly or every COMEBin job fails.
    comebin_device: 'cpu'
    # Binette scoring: higher weight penalises contamination more. In low-biomass
    # tumour samples a contaminated bin is worse than no bin.
    binette_contamination_weight: 5
    separator: ":"
    minfasta: 200000 # the min bin size for VAMB

mge:
    genomad_db: '/hpcfs/users/a1667917/genomad/genomad_db'


