name: spades
channels:
    - conda-forge
    - bioconda
    - defaults
dependencies:
    # Bumped from 3.15.5. The old version's Python wrapper imports distutils,
    # removed in Python 3.12, so it only worked with an old interpreter -- the
    # 2023 env solved to python 3.11.4, and a rebuild today solved to 3.14.7 and
    # failed every job instantly. Updating the assembler is the better fix than
    # pinning python backwards to keep a 2022-era SPAdes alive.
    - spades = 4.3.0
