cluster:
  mkdir -p logs/{rule}/ &&
  sbatch
    --nodes=1
    --cpus-per-task={threads}
    --mem={resources.mem_mb}
    --time={resources.time}
    --job-name=smk-{rule}
    --parsable
    --output=logs/{rule}/{jobid}.out
    --error=logs/{rule}/{jobid}.err
    {resources.slurm_extra}
default-resources:
  - mem_mb=4000
  - time=1320
  # Pass-through for per-rule sbatch flags. This submission line has no
  # --partition and no --gres, so a rule needing a GPU could not ask for one.
  # run_baktfold sets it (see config.yaml: resources.gpu). The default is a
  # no-op flag rather than an empty string, because an empty substitution would
  # leave a bare gap that some sbatch versions parse as a missing argument.
  #
  # THE QUOTES ARE LOAD-BEARING. Snakemake evaluates default-resources values as
  # PYTHON EXPRESSIONS, so a bare --nice=0 raises
  #     WorkflowError: Failed to evaluate default resources value '--nice=0'
  #     SyntaxError: invalid syntax
  # and takes down every rule that does not override the value. It surfaces only
  # when a rule is actually submitted, so the DAG builds fine and the driver dies
  # seconds later.
  - slurm_extra="--nice=0"
jobs: 50
latency-wait: 30
local-cores: 8
restart-times: 1
max-jobs-per-second: 10
keep-going: True
rerun-incomplete: True
printshellcmds: True
scheduler: greedy
use-conda: True
conda-frontend: conda
cluster-status: /hpcfs/users/a1667917/TCGA_CPTAC_190823_Final_Analysis/WGS_TCGA_Kraken_Pipeline/tcga_cptac_taxonomic_profiler/profile/slurm/slurm_status.py
max-status-checks-per-second: 10